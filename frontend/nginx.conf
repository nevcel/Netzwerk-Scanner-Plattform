server {
    listen 80;
    server_name _;

    # Verzeichnis unserer Weboberfläche.
    root /usr/share/nginx/html;
    index index.html;

    # REST-Anfragen werden intern an das Go-Backend weitergeleitet.
    location /api/ {
        proxy_pass http://backend:8080;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Auslieferung der statischen HTML-, CSS- und JavaScript-Dateien.
    location / {
        try_files $uri $uri/ /index.html;
    }
}